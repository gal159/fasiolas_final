name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `secrets` negalima naudoti zingsnio `if:` salygoje (workflow tampa netinkamas ir
    # nepasileidzia). Todel paslaptys perkeliamos i job env, o `if:` tikrina `env`.
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render Deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Trigger Vercel Deploy
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK_URL"
